name: Refresh report snapshots

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start report server
        run: npm start > /tmp/solana-pulse.log 2>&1 &
      - name: Wait for report API
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/api/report > /dev/null && exit 0
            sleep 2
          done
          cat /tmp/solana-pulse.log
          exit 1
      - name: Generate JSON and Markdown snapshots
        run: npm run report
        env:
          ARCHIVE_REPORTS: "1"
      - name: Commit changed snapshots
        run: |
          git config user.name "solana-pulse-bot"
          git config user.email "solana-pulse-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh Solana ecosystem report"
          git push
